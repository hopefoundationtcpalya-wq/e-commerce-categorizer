<!DOCTYPE html>
<html>
<head>
    <title>Product Categorizer</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f0f0f0; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 400px; margin: auto; box-shadow: 0 0 10px #ccc; }
        input { width: 80%; padding: 10px; margin: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🛒 Product Categorizer AI</h1>
        <p>Enter a product name and AI will guess the category</p>
        <form action="/predict" method="POST">
            <input type="text" name="product_name" placeholder="e.g. iphone 15, nike shoes, samsung tv" required>
            <br>
            <button type="submit">Predict Category</button>
        </form>
        {% if prediction %}
            <h2 style="color: green; margin-top: 20px;">Category: {{ prediction }}</h2>
        {% endif %}
    </div>
</body>
</html>
